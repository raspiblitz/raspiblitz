# LND configuration (hybrid settings at rest, as a legacy TunnelSats v3 install leaves them)

[Application Options]
listen=0.0.0.0:9735
rpclisten=0.0.0.0:10009
restlisten=0.0.0.0:8080
nat=false
externalhosts=de2.tunnelsats.com:24556
debuglevel=info

[Bitcoin]
bitcoin.active=1
bitcoin.mainnet=1
bitcoin.node=bitcoind

[Bitcoind]
bitcoind.rpchost=127.0.0.1:8332
bitcoind.rpcuser=raspibolt
bitcoind.rpcpass=fixture-rpc-password-not-a-secret

[tor]
tor.active=true
tor.v3=true
tor.socks=9050
tor.control=9051
tor.streamisolation=false
tor.skip-proxy-for-clearnet-targets=true
