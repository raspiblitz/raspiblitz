name: Test bats

concurrency:
  group: test-bats-${{ github.head_ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: ["dev"]
    paths:
      - "home.admin/config.scripts/bonus.postgresql.sh"
      - "home.admin/config.scripts/cl.hsmtool.sh"
      - "test/cl.hsmtool-generatehsm.bats"
  pull_request:
    branches: ["*"]
    paths:
      - "home.admin/config.scripts/bonus.postgresql.sh"
      - "home.admin/config.scripts/cl.hsmtool.sh"
      - "test/cl.hsmtool-generatehsm.bats"

jobs:
  run-bats-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install bats
        run: |
          sudo apt update &>/dev/null
          sudo apt install -y bats

      - name: Run the bats tests with postgresql 15
        run: |
          cd test
          sudo bats ./bonus.postgresql-15.bats

      - name: Run the bats tests with postgresql 13
        run: |
          cd test
          sudo bats ./bonus.postgresql-13.bats

      - name: Run the cl.hsmtool generatehsm interface tests
        run: |
          cd test
          bats ./cl.hsmtool-generatehsm.bats
