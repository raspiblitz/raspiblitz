name: Test bats

concurrency:
  group: test-bats-${{ github.head_ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: ["dev"]
    paths:
      - "home.admin/config.scripts/bonus.postgresql.sh"
      - "home.admin/config.scripts/bonus.joinmarket-ng.sh"
      - "home.admin/config.scripts/blitz.passwords.sh"
      - "home.admin/config.scripts/joinmarket-ng-service.sh"
      - "home.admin/config.scripts/joinmarket-ng-trusted-keys.asc"
      - "test/bonus.joinmarket-ng.bats"
  pull_request:
    branches: ["*"]
    paths:
      - "home.admin/config.scripts/bonus.postgresql.sh"
      - "home.admin/config.scripts/bonus.joinmarket-ng.sh"
      - "home.admin/config.scripts/blitz.passwords.sh"
      - "home.admin/config.scripts/joinmarket-ng-service.sh"
      - "home.admin/config.scripts/joinmarket-ng-trusted-keys.asc"
      - "test/bonus.joinmarket-ng.bats"

jobs:
  run-bats-tests-postgresql:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install bats
        run: |
          sudo apt update &>/dev/null
          sudo apt install -y bats

      - name: Run the bats tests with postgresql 15
        run: |
          cd test
          sudo bats ./bonus.postgresql-15.bats

      - name: Run the bats tests with postgresql 13
        run: |
          cd test
          sudo bats ./bonus.postgresql-13.bats

  run-bats-tests-joinmarket-ng:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install bats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats

      - name: Run JoinMarket-NG integration tests
        run: |
          cd test
          sudo bats ./bonus.joinmarket-ng.bats
