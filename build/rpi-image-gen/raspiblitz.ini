# RaspiBlitz Image Build Configuration
# Main configuration file for building RaspiBlitz images with rpi-image-gen

[image]
# Base image to use
# For Raspberry Pi: use latest Raspberry Pi OS Lite (64-bit)
base_image = raspios_arm64_lite

# Output image name
output_name = raspiblitz-${VERSION:-dev}

# Image size (ensure enough space for Bitcoin blockchain headers, LN data, etc.)
# Recommended: 16GB minimum for lean, 32GB for fatpack
size = 16G

# Image format (raw or qcow2)
format = raw

# Compression for final image
compress = gzip

[build]
# Architecture
arch = arm64

# Layers to apply (in order)
layers = 
    raspiblitz-base.yaml
    raspiblitz-provision.yaml

# Build variables
# These can be overridden via environment variables or command line
variables =
    GITHUB_USER=raspiblitz
    BRANCH=dev
    FATPACK=false
    DISPLAY=headless
    WIFI_REGION=off
    VERSION=dev

[system]
# Hostname
hostname = raspiblitz

# Default users
# The admin user is created with default password "raspiblitz"
# Users should change this on first boot
default_user = admin
default_password = raspiblitz

# Timezone
timezone = UTC

# Locale
locale = en_US.UTF-8

[boot]
# Boot partition size
boot_size = 512M

# Boot partition filesystem
boot_fs = vfat

# Enable SSH on first boot
enable_ssh = true

# First boot script
# RaspiBlitz uses its own bootstrap mechanism
first_boot_script = /home/admin/_bootstrap.sh

[partitions]
# Partition layout
# boot: Boot partition (FAT32)
# root: Root filesystem (ext4)
# data: Optional data partition for blockchain (can be expanded by user)

boot.size = 512M
boot.type = vfat
boot.label = boot

root.size = 15G
root.type = ext4
root.label = rootfs

[options]
# Additional build options

# Skip QEMU emulation if building on native hardware
skip_qemu = false

# Keep intermediate artifacts for debugging
keep_artifacts = false

# Generate SBOM (Software Bill of Materials)
generate_sbom = true

# Verify image after build
verify_image = true

# Clean up build directory after successful build
clean_after_build = true
