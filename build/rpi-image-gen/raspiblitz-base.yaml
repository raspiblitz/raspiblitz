# RaspiBlitz Base Layer Configuration
# This layer installs base system packages required for RaspiBlitz

name: raspiblitz-base
description: Base system packages for RaspiBlitz

# Base packages required for RaspiBlitz operation
packages:
  # System utilities
  - curl
  - wget
  - git
  - jq
  - qrencode
  - dphys-swapfile
  - htop
  - vim
  - screen
  - fail2ban
  - ufw
  - net-tools
  - policykit-1
  
  # Build tools (needed for compiling dependencies)
  - build-essential
  - gcc
  - g++
  - make
  - automake
  - autoconf
  - libtool
  - pkg-config
  
  # Python
  - python3
  - python3-pip
  - python3-dev
  - python3-venv
  - python3-systemd
  
  # Cryptography libraries
  - libssl-dev
  - libffi-dev
  - libgmp-dev
  
  # Hardware support (for LCD displays and I2C devices)
  # These are lightweight packages and included by default for maximum hardware compatibility
  # They have minimal overhead even when unused (headless mode)
  - i2c-tools
  - python3-smbus
  
  # Storage utilities
  - parted
  - dosfstools
  - cryptsetup
  
  # Network tools
  - openssh-server
  - rsync
  - socat
  
  # Log rotation
  - logrotate
  - rsyslog
  
  # RaspberryPi specific (only installed on raspios_arm64)
  - raspi-config

# System configuration
files:
  # Placeholder for any base system configuration files
  # These will be added by the provision layer

# Commands to run during layer installation
run:
  # Ensure system is up to date
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get upgrade -y -q
  
  # Create admin user if it doesn't exist
  - |
    if ! id -u admin >/dev/null 2>&1; then
      useradd -m -s /bin/bash -G sudo admin
      echo "admin:raspiblitz" | chpasswd
    fi
  
  # Set locale
  - sed -i 's/^# en_US.UTF-8 UTF-8/en_US.UTF-8 UTF-8/' /etc/locale.gen
  - locale-gen en_US.UTF-8
  - update-locale LANG=en_US.UTF-8
  
  # Configure timezone to UTC by default
  - ln -sf /usr/share/zoneinfo/UTC /etc/localtime
  
  # Clean up
  - apt-get autoremove -y
  - apt-get clean
